name: oui-hermes

services:
  oui-hermes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_HASH: ${BUILD_HASH:-local}
    image: oui-hermes:agui-bridge-mcp-${BUILD_HASH:-local}
    container_name: oui-hermes
    volumes:
      - oui-hermes-data:/app/backend/data
      - ${HERMES_EXPERT_AGENT_SKILLS_DIR_HOST:-${HOME}/.hermes/profiles/expert-agent/skills}:/opt/hermes/expert-agent/skills
      - ${HERMES_EXPERT_AGENT_STATE_DB_HOST:-${HOME}/.hermes/profiles/expert-agent/state.db}:${HERMES_EXPERT_AGENT_STATE_DB_CONTAINER:-/opt/hermes/expert-agent/state.db}:ro
    ports:
      - ${OUI_HERMES_PORT-3000}:8080
    environment:
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL-http://host.docker.internal:8642}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL-http://host.docker.internal:8642}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY-}
      HERMES_EXPERT_AGENT_SKILLS_DIR: ${HERMES_EXPERT_AGENT_SKILLS_DIR_CONTAINER:-/opt/hermes/expert-agent/skills}
      HERMES_EXPERT_AGENT_STATE_DB: ${HERMES_EXPERT_AGENT_STATE_DB_CONTAINER:-/opt/hermes/expert-agent/state.db}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY-}
      S3_REGION_NAME: ${S3_REGION_NAME-us-east-1}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE-path}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX-open-webui}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL-}
      ENABLE_OLLAMA_API: 'false'
      ENABLE_CHANNELS: 'false'
      ENABLE_NOTES: 'false'
      ENABLE_CALENDAR: 'false'
      ENABLE_WEB_SEARCH: 'false'
      ENABLE_CODE_EXECUTION: 'false'
      ENABLE_CODE_INTERPRETER: 'false'
      ENABLE_IMAGE_GENERATION: 'false'
      VECTOR_DB: none
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: always

  agui-bridge-mcp:
    build:
      context: .
      dockerfile: Dockerfile.agui-mcp
    image: oui-hermes-agui-mcp:agui-bridge-mcp-${BUILD_HASH:-local}
    container_name: oui-hermes-agui-mcp
    ports:
      - ${AGUI_MCP_PORT-8000}:8000
    restart: always

volumes:
  oui-hermes-data: {}
