services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: oui-hermes-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD-minioadmin}
    volumes:
      - oui-hermes-minio-data:/data
    ports:
      - ${MINIO_API_PORT-9000}:9000
      - ${MINIO_CONSOLE_PORT-9001}:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: oui-hermes-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET_NAME"
        mc anonymous set download "local/$$S3_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME-hermes-artifacts}
    restart: "no"

  oui-hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: oui-hermes:local
    container_name: oui-hermes
    volumes:
      - oui-hermes-data:/app/backend/data
    ports:
      - ${OUI_HERMES_PORT-3000}:8080
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL-http://host.docker.internal:8642}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL-http://host.docker.internal:8642}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY-}
      S3_REGION_NAME: ${S3_REGION_NAME-us-east-1}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE-path}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX-open-webui}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL-}
      ENABLE_OLLAMA_API: 'false'
      ENABLE_CHANNELS: 'false'
      ENABLE_NOTES: 'false'
      ENABLE_CALENDAR: 'false'
      ENABLE_WEB_SEARCH: 'false'
      ENABLE_CODE_EXECUTION: 'false'
      ENABLE_CODE_INTERPRETER: 'false'
      ENABLE_IMAGE_GENERATION: 'false'
      VECTOR_DB: none
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  oui-hermes-data: {}
  oui-hermes-minio-data: {}
